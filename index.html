<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6366f1">
<title>ردیاب مطالعه کتاب</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Vazirmatn, Tahoma, sans-serif; }
  :root {
    --primary: #6366f1; --primary-dark: #4f46e5;
    --bg: #f8fafc; --card: #fff; --text: #1e293b;
    --muted: #64748b; --border: #e2e8f0;
    --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
  }
  body { background: var(--bg); color: var(--text); padding-bottom: 80px; min-height: 100vh; }
  
  header {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white; padding: 20px; text-align: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.1);
  }
  header h1 { font-size: 1.4rem; }
  header p { font-size: .85rem; opacity: .9; margin-top: 4px; }

  .container { max-width: 700px; margin: 0 auto; padding: 16px; }

  /* Tabs */
  .tabs {
    display: flex; background: var(--card); border-radius: 12px;
    padding: 4px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .tab {
    flex: 1; padding: 10px; text-align: center; border: none;
    background: none; cursor: pointer; border-radius: 8px;
    font-size: .9rem; color: var(--muted); transition: .2s;
  }
  .tab.active { background: var(--primary); color: white; font-weight: 600; }
  .page { display: none; }
  .page.active { display: block; }

  /* Cards */
  .card {
    background: var(--card); border-radius: 12px; padding: 16px;
    margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }

  /* Form */
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: .85rem; margin-bottom: 6px; color: var(--muted); }
  input, select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: .95rem; font-family: inherit;
    background: var(--card); color: var(--text);
  }
  input:focus, select:focus { outline: 2px solid var(--primary); border-color: transparent; }
  
  .btn {
    padding: 10px 16px; border: none; border-radius: 8px;
    font-size: .9rem; font-family: inherit; cursor: pointer;
    transition: .2s; font-weight: 600;
  }
  .btn-primary { background: var(--primary); color: white; width: 100%; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-sm { padding: 6px 12px; font-size: .8rem; }
  .btn-danger { background: var(--danger); color: white; }
  .btn-success { background: var(--success); color: white; }
  .btn-secondary { background: var(--border); color: var(--text); }

  /* Book item */
  .book {
    display: flex; flex-direction: column; gap: 10px;
  }
  .book-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .book-title { font-weight: 700; font-size: 1rem; }
  .book-author { font-size: .8rem; color: var(--muted); margin-top: 2px; }
  .book-status {
    font-size: .7rem; padding: 3px 8px; border-radius: 20px;
    font-weight: 600; white-space: nowrap;
  }
  .status-reading { background: #dbeafe; color: #1e40af; }
  .status-done { background: #d1fae5; color: #065f46; }
  
  .progress-bar {
    height: 10px; background: var(--border); border-radius: 10px;
    overflow: hidden; position: relative;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-dark));
    transition: width .3s; border-radius: 10px;
  }
  .progress-info {
    display: flex; justify-content: space-between;
    font-size: .8rem; color: var(--muted);
  }
  
  .book-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .book-actions button { flex: 1; min-width: 80px; }

  /* Stats */
  .stats-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px;
  }
  .stat-card {
    background: var(--card); border-radius: 12px; padding: 16px;
    text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .stat-value { font-size: 1.8rem; font-weight: 800; color: var(--primary); }
  .stat-label { font-size: .8rem; color: var(--muted); margin-top: 4px; }
  
  /* Chart */
  .chart { height: 180px; display: flex; align-items: flex-end; gap: 6px; padding-top: 20px; }
  .chart-bar {
    flex: 1; background: linear-gradient(to top, var(--primary), #a5b4fc);
    border-radius: 6px 6px 0 0; min-height: 4px; position: relative;
    transition: .3s;
  }
  .chart-bar:hover { opacity: .8; }
  .chart-label {
    font-size: .65rem; text-align: center; color: var(--muted);
    position: absolute; bottom: -20px; left: 0; right: 0;
  }
  .chart-container { padding-bottom: 30px; }
  
  .empty {
    text-align: center; padding: 40px 20px; color: var(--muted);
  }
  .empty-icon { font-size: 3rem; margin-bottom: 10px; }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card); border-radius: 16px; padding: 20px;
    width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto;
  }
  .modal h3 { margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .modal-actions button { flex: 1; }

  /* History */
  .history-item {
    display: flex; justify-content: space-between; padding: 10px 0;
    border-bottom: 1px solid var(--border); font-size: .85rem;
  }
  .history-item:last-child { border-bottom: none; }
  
  @media (min-width: 600px) {
    .stats-grid { grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>

<header>
  <h1>📚 ردیاب مطالعه</h1>
  <p>پیشرفت مطالعه کتاب‌هایت را ثبت کن</p>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab active" data-page="books">کتاب‌ها</button>
    <button class="tab" data-page="stats">آمار</button>
    <button class="tab" data-page="add">افزودن</button>
  </div>

  <!-- صفحه کتاب‌ها -->
  <div class="page active" id="page-books">
    <div id="booksList"></div>
  </div>

  <!-- صفحه آمار -->
  <div class="page" id="page-stats">
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-value" id="statBooks">0</div><div class="stat-label">کل کتاب‌ها</div></div>
      <div class="stat-card"><div class="stat-value" id="statRead">0</div><div class="stat-label">تمام‌شده</div></div>
      <div class="stat-card"><div class="stat-value" id="statPages">0</div><div class="stat-label">صفحات خوانده‌شده</div></div>
      <div class="stat-card"><div class="stat-value" id="statSessions">0</div><div class="stat-label">جلسات مطالعه</div></div>
    </div>
    <div class="card">
      <h3 style="margin-bottom: 8px; font-size: 1rem;">📊 مطالعه ۷ روز اخیر (تعداد جلسه)</h3>
      <div class="chart-container">
        <div class="chart" id="weekChart"></div>
      </div>
    </div>
    <div class="card">
      <h3 style="margin-bottom: 12px; font-size: 1rem;">🕓 تاریخچه اخیر</h3>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- صفحه افزودن -->
  <div class="page" id="page-add">
    <div class="card">
      <h3 style="margin-bottom: 16px;">افزودن کتاب جدید</h3>
      <form id="addBookForm">
        <div class="form-group">
          <label>عنوان کتاب *</label>
          <input type="text" id="bookTitle" required placeholder="مثلاً: صد سال تنهایی">
        </div>
        <div class="form-group">
          <label>نویسنده</label>
          <input type="text" id="bookAuthor" placeholder="مثلاً: گابریل گارسیا مارکز">
        </div>
        <div class="form-group">
          <label>تعداد کل صفحات *</label>
          <input type="number" id="bookPages" required min="1" placeholder="مثلاً: 400">
        </div>
        <button type="submit" class="btn btn-primary">افزودن کتاب</button>
      </form>
    </div>
  </div>
</div>

<!-- مودال ثبت پیشرفت -->
<div class="modal-overlay" id="progressModal">
  <div class="modal">
    <h3>ثبت پیشرفت مطالعه</h3>
    <p id="modalBookTitle" style="color: var(--muted); font-size: .85rem; margin-bottom: 12px;"></p>
    <div class="form-group">
      <label>تعداد صفحات خوانده‌شده در این جلسه</label>
      <input type="number" id="pagesRead" min="1" placeholder="مثلاً: 25">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">انصراف</button>
      <button class="btn btn-primary" onclick="submitProgress()">ثبت</button>
    </div>
  </div>
</div>

<script>
// ============ State ============
let books = JSON.parse(localStorage.getItem('books') || '[]');
let sessions = JSON.parse(localStorage.getItem('sessions') || '[]');
let currentBookId = null;

// ============ Helpers ============
function save() {
  localStorage.setItem('books', JSON.stringify(books));
  localStorage.setItem('sessions', JSON.stringify(sessions));
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayKey() { return new Date().toISOString().slice(0,10); }
function formatDate(d) {
  return new Date(d).toLocaleDateString('fa-IR', { month: 'short', day: 'numeric' });
}

// ============ Tabs ============
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('page-' + tab.dataset.page).classList.add('active');
    if (tab.dataset.page === 'stats') renderStats();
  };
});

// ============ Add Book ============
document.getElementById('addBookForm').onsubmit = (e) => {
  e.preventDefault();
  const title = document.getElementById('bookTitle').value.trim();
  const author = document.getElementById('bookAuthor').value.trim();
  const total = parseInt(document.getElementById('bookPages').value);
  if (!title || !total) return;
  
  books.unshift({
    id: uid(), title, author, totalPages: total,
    readPages: 0, createdAt: Date.now()
  });
  save();
  e.target.reset();
  document.querySelector('[data-page="books"]').click();
  renderBooks();
};

// ============ Render Books ============
function renderBooks() {
  const list = document.getElementById('booksList');
  if (books.length === 0) {
    list.innerHTML = `<div class="card empty">
      <div class="empty-icon">📖</div>
      <p>هنوز کتابی اضافه نکردی!</p>
      <p style="font-size:.8rem;margin-top:8px;">از تب «افزودن» شروع کن</p>
    </div>`;
    return;
  }
  list.innerHTML = books.map(b => {
    const percent = Math.min(100, Math.round(b.readPages / b.totalPages * 100));
    const done = b.readPages >= b.totalPages;
    return `<div class="card book">
      <div class="book-header">
        <div>
          <div class="book-title">${escapeHtml(b.title)}</div>
          ${b.author ? `<div class="book-author">${escapeHtml(b.author)}</div>` : ''}
        </div>
        <span class="book-status ${done ? 'status-done' : 'status-reading'}">
          ${done ? '✓ تمام شد' : 'در حال مطالعه'}
        </span>
      </div>
      <div>
        <div class="progress-bar"><div class="progress-fill" style="width:${percent}%"></div></div>
        <div class="progress-info">
          <span>${b.readPages} / ${b.totalPages} صفحه</span>
          <span>${percent}%</span>
        </div>
      </div>
      <div class="book-actions">
        ${!done ? `<button class="btn btn-primary btn-sm" onclick="openProgress('${b.id}')">+ ثبت پیشرفت</button>` : ''}
        <button class="btn btn-danger btn-sm" onclick="deleteBook('${b.id}')">حذف</button>
      </div>
    </div>`;
  }).join('');
}

// ============ Progress ============
function openProgress(id) {
  currentBookId = id;
  const b = books.find(x => x.id === id);
  document.getElementById('modalBookTitle').textContent = b.title;
  document.getElementById('pagesRead').value = '';
  document.getElementById('progressModal').classList.add('show');
  setTimeout(() => document.getElementById('pagesRead').focus(), 100);
}
function closeModal() {
  document.getElementById('progressModal').classList.remove('show');
  currentBookId = null;
}
function submitProgress() {
  const pages = parseInt(document.getElementById('pagesRead').value);
  if (!pages || pages <= 0 || !currentBookId) return;
  const b = books.find(x => x.id === currentBookId);
  const remaining = b.totalPages - b.readPages;
  const actual = Math.min(pages, remaining);
  
  b.readPages += actual;
  sessions.unshift({
    id: uid(),
    bookId: b.id,
    bookTitle: b.title,
    pages: actual,
    date: Date.now(),
    day: todayKey()
  });
  save();
  closeModal();
  renderBooks();
}
document.getElementById('pagesRead').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitProgress();
});
document.getElementById('progressModal').onclick = (e) => {
  if (e.target.id === 'progressModal') closeModal();
};

// ============ Delete ============
function deleteBook(id) {
  if (!confirm('این کتاب و تاریخچه‌اش حذف شود؟')) return;
  books = books.filter(x => x.id !== id);
  sessions = sessions.filter(x => x.bookId !== id);
  save();
  renderBooks();
}

// ============ Stats ============
function renderStats() {
  document.getElementById('statBooks').textContent = books.length;
  document.getElementById('statRead').textContent = books.filter(b => b.readPages >= b.totalPages).length;
  document.getElementById('statPages').textContent = books.reduce((s,b) => s + b.readPages, 0);
  document.getElementById('statSessions').textContent = sessions.length;
  
  // Week chart
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0,10);
    const count = sessions.filter(s => s.day === key).length;
    days.push({ label: d.toLocaleDateString('fa-IR', {weekday:'short'}), count, key });
  }
  const maxCount = Math.max(1, ...days.map(d => d.count));
  document.getElementById('weekChart').innerHTML = days.map(d => `
    <div class="chart-bar" style="height:${(d.count/maxCount)*140}px" title="${d.count} جلسه">
      <span class="chart-label">${d.label}</span>
    </div>
  `).join('');
  
  // History
  const recent = sessions.slice(0, 10);
  document.getElementById('historyList').innerHTML = recent.length
    ? recent.map(s => `<div class="history-item">
        <span>${escapeHtml(s.bookTitle)}</span>
        <span style="color:var(--muted);">${s.pages} صفحه — ${formatDate(s.date)}</span>
      </div>`).join('')
    : '<p class="empty" style="padding:20px;">هنوز جلسه‌ای ثبت نشده</p>';
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ============ Service Worker ============
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(console.error);
}

// ============ Init ============
renderBooks();
</script>
</body>
  </html>
